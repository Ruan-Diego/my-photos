[package]
name = "my-photos"
version = "1.0.1"
description = "My Photos: fotos e vídeos do seu disco, sem nuvem"
authors = ["Ruan"]
edition = "2021"
# u32::is_multiple_of (photo_meta::date) is stable since 1.87.
rust-version = "1.87"
# More than one binary since F03 (the dev tools below); `tauri dev` runs the app.
default-run = "my-photos"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "my_photos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Ferramentas de desenvolvimento (medições, varredura e indexação pela linha de comando).
# Ficam fora do build normal, e portanto fora do instalador:
#   cargo run --features dev-tools --bin f05-scan
[features]
dev-tools = []

[[bin]]
name = "f03-bench"
required-features = ["dev-tools"]

[[bin]]
name = "f05-scan"
required-features = ["dev-tools"]

[[bin]]
name = "f10-index"
required-features = ["dev-tools"]

[[bin]]
name = "f12-thumbs"
required-features = ["dev-tools"]

# Roda o f03-bench; o CI usa `cargo test --features dev-tools`.
[[test]]
name = "f03_bench"
required-features = ["dev-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
kamadak-exif = "0.6.1"
imagesize = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# F36: unwind, so a decoder panic on one bad file is caught (src/isolate.rs).
panic = "unwind"
strip = true
