# F15–F19: the disk card, the indexing run, its progress screen, the timeline and the viewer. With any app
# permission defined here, Tauri denies every app command no capability allows.

[[permission]]
identifier = "allow-library-summary"
description = "Enables the library_summary command."
commands.allow = ["library_summary"]

[[permission]]
identifier = "allow-library-folder"
description = "Enables the library_folder command."
commands.allow = ["library_folder"]

[[permission]]
identifier = "allow-start-indexing"
description = "Enables the start_indexing command."
commands.allow = ["start_indexing"]

[[permission]]
identifier = "allow-pause-indexing"
description = "Enables the pause_indexing command."
commands.allow = ["pause_indexing"]

[[permission]]
identifier = "allow-recent-thumbnails"
description = "Enables the recent_thumbnails command."
commands.allow = ["recent_thumbnails"]

[[permission]]
identifier = "allow-timeline"
description = "Enables the timeline command."
commands.allow = ["timeline"]

[[permission]]
