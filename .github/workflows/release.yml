name: release

# F37: o instalador do Windows. Uma tag `v0.2.0` (igual à versão do package.json) gera
# `My Photos_0.2.0_x64-setup.exe` num release em rascunho, para revisar antes de publicar.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: A tag bate com a versão
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: My Photos __VERSION__
          releaseBody: Instalador do Windows. Baixe `My Photos_*_x64-setup.exe`.
          releaseDraft: true
          args: --bundles nsis
