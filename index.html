<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Photos</title>
    <!-- Tema antes da primeira pintura: a janela nunca abre clara e vira escura.
         Mesma chave e valores de src/theme/theme.ts; cores de --ground do canvas. -->
    <script>
      try {
        var theme = localStorage.getItem("myphotos.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
    <style>
      html { background: #f4f0e8; }
      html[data-theme="dark"] { background: #161513; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #161513; } }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
